name: Release

run-name: Release ${{ inputs.bump }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build package
        run: npm run build

      - name: Inspect package contents
        run: npm pack --dry-run

  release:
    name: Create release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install release tooling
        run: npm ci --ignore-scripts

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx release-it "${{ inputs.bump }}" --ci

      - name: Dispatch npm publication from the release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node --print "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          tag="v${version}"
          tag_commit="$(git rev-parse "${tag}^{commit}")"
          head_commit="$(git rev-parse HEAD)"

          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "Release tag $tag does not point to the release commit."
            exit 1
          fi

          gh workflow run publish.yml --ref "$tag"
