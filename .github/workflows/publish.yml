name: Publish

run-name: Publish ${{ github.ref_name }} to npm

on:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify release tag
        shell: bash
        run: |
          expected_tag="v$(node --print "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"

          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Publishing requires a tag ref; received $GITHUB_REF."
            exit 1
          fi

          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected_tag."
            exit 1
          fi

      - name: Build package
        run: npm run build

      - name: Inspect package contents
        run: npm pack --dry-run --ignore-scripts

      - name: Publish to npm
        run: npm publish --ignore-scripts
